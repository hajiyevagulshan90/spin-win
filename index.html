<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Azərbaycan HR İnstitutu – Endirim Çarxı</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111111, #292929);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: clamp(24px, 7vw, 32px);
      margin: 0 0 8px;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 25px;
    }

    .wheel-container {
      position: relative;
      width: min(82vw, 420px);
      height: min(82vw, 420px);
      margin: 0 auto 25px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow:
        0 0 0 8px white,
        0 0 35px rgba(255,255,255,0.2);
      transform-origin: center center;
    }

    .pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 35px solid #ffffff;
      z-index: 10;
      filter: drop-shadow(0 3px 3px rgba(0,0,0,0.4));
    }

    button {
      border: none;
      background: white;
      color: #111;
      font-size: 20px;
      font-weight: bold;
      padding: 15px 45px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      transition: transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result {
      margin-top: 22px;
      min-height: 65px;
    }

    .result-title {
      font-size: 14px;
      opacity: 0.7;
    }

    .discount {
      font-size: clamp(32px, 10vw, 38px);
      font-weight: bold;
      margin-top: 4px;
    }

    .small {
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>ENDİRİM ÇARXI</h1>

  <div class="subtitle">
    Təlimlərimizə endirim qazan!
  </div>

  <div class="wheel-container">
    <div class="pointer"></div>

    <canvas id="wheel" width="500" height="500"></canvas>
  </div>

  <button id="spinButton" type="button" onclick="spin()">
    FIRLAT
  </button>

  <div class="result">
    <div class="result-title" id="resultTitle"></div>
    <div class="discount" id="result"></div>
  </div>

  <div class="small">
    Azərbaycan HR İnstitutu
  </div>

</div>

<script>

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const discounts = [
  "5%",
  "10%",
  "30%",
  "50%",
  "100%"
];

const colors = [
  "#D4AF37",
  "#1E3A5F",
  "#7A1F1F",
  "#176B5D",
  "#333333"
];

let currentRotation = 0;
let spinning = false;


/* ----------------------------------
   ƏVVƏL İSTİFADƏ EDİLİB?
---------------------------------- */

const alreadySpun =
  localStorage.getItem("hr_spin_used");

if (alreadySpun === "true") {

  const button =
    document.getElementById("spinButton");

  button.disabled = true;

  button.innerText =
    "ARTIQ İSTİFADƏ EDİLİB";

  document.getElementById("resultTitle").innerText =
    "Siz artıq iştirak etmisiniz.";
}


/* ----------------------------------
   ÇARXI ÇƏK
---------------------------------- */

function drawWheel() {

  const center = canvas.width / 2;
  const radius = canvas.width / 2;
  const slice = (Math.PI * 2) / discounts.length;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  discounts.forEach((discount, i) => {

    const startAngle = i * slice;
    const endAngle = startAngle + slice;

    ctx.beginPath();

    ctx.moveTo(center, center);

    ctx.arc(
      center,
      center,
      radius,
      startAngle,
      endAngle
    );

    ctx.closePath();

    ctx.fillStyle = colors[i];
    ctx.fill();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.save();

    ctx.translate(center, center);

    ctx.rotate(
      startAngle + slice / 2
    );

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 32px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
      discount,
      radius * 0.65,
      0
    );

    ctx.restore();

  });
}


/* ----------------------------------
   ENDİRİM SEÇİMİ
---------------------------------- */

function chooseDiscount() {

  const random = Math.random();

  if (random < 0.35) {
    return 0;
  }

  if (random < 0.65) {
    return 1;
  }

  if (random < 0.85) {
    return 2;
  }

  return 3;
}


/* ----------------------------------
   SPİN
---------------------------------- */

function spin() {

  if (spinning) return;

  if (
    localStorage.getItem("hr_spin_used")
    === "true"
  ) {

    document.getElementById("resultTitle").innerText =
      "Siz artıq iştirak etmisiniz.";

    return;
  }

  spinning = true;

  const button =
    document.getElementById("spinButton");

  button.disabled = true;

  document.getElementById("resultTitle").innerText = "";
  document.getElementById("result").innerText = "";

  /*
    İNDİLİK TEST ÜÇÜN
    5 / 10 / 30 / 50 faiz işləyir.
  */

  const selectedIndex =
    chooseDiscount();

  startAnimation(selectedIndex);
}


/* ----------------------------------
   ANİMASİYA
---------------------------------- */

function startAnimation(selectedIndex) {

  const button =
    document.getElementById("spinButton");

  const slice =
    360 / discounts.length;

  const targetAngle =
    270 -
    (
      selectedIndex * slice +
      slice / 2
    );

  const extraSpins =
    5 * 360;

  const currentNormalized =
    ((currentRotation % 360) + 360) % 360;

  let rotationDifference =
    targetAngle -
    currentNormalized;

  if (rotationDifference < 0) {
    rotationDifference += 360;
  }

  const finalRotation =
    currentRotation +
    extraSpins +
    rotationDifference;

  const duration = 4500;

  const start =
    performance.now();

  const initialRotation =
    currentRotation;


  function animate(time) {

    const elapsed =
      time - start;

    const progress =
      Math.min(
        elapsed / duration,
        1
      );

    const ease =
      1 -
      Math.pow(
        1 - progress,
        4
      );

    currentRotation =
      initialRotation +
      (
        finalRotation -
        initialRotation
      ) * ease;

    canvas.style.transform =
      "rotate(" +
      currentRotation +
      "deg)";


    if (progress < 1) {

      requestAnimationFrame(
        animate
      );

    } else {

      spinning = false;

      localStorage.setItem(
        "hr_spin_used",
        "true"
      );

      document.getElementById("resultTitle").innerText =
        "TƏBRİKLƏR!";

      document.getElementById("result").innerText =
        discounts[selectedIndex] +
        " ENDİRİM";

      button.disabled = true;

      button.innerText =
        "ARTIQ İSTİFADƏ EDİLİB";
    }
  }

  requestAnimationFrame(animate);
}


drawWheel();

</script>

</body>
</html>
